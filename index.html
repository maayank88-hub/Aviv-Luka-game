<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aviv & Luka's City Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;touch-action:none}
#wrap{position:relative;width:min(430px,100vw);height:min(932px,100vh);overflow:hidden;border-radius:28px;box-shadow:0 0 80px rgba(0,0,0,0.7);background:#2d5a27}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:16px 18px;display:none;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
#score-box{background:rgba(255,255,255,0.95);border-radius:20px;padding:8px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,0.2)}
#score-box span{font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;color:#1D3557}
#lives{display:flex;gap:4px}
.heart{font-size:22px}
.heart.lost{filter:grayscale(1) opacity(0.35)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#start-screen{background:linear-gradient(170deg,#fde8f0,#e8f4fd 60%,#f0fde8)}
#start-screen h1{font-family:'Baloo 2',cursive;font-size:38px;font-weight:800;color:#1D3557;text-align:center;line-height:1.1;margin-bottom:6px;text-shadow:3px 3px 0 rgba(255,255,255,0.6)}
#start-screen p{font-family:'Nunito',sans-serif;font-size:15px;color:#555;text-align:center;padding:0 32px;margin-bottom:28px}
.btn{background:#1D3557;color:white;font-family:'Baloo 2',cursive;font-size:20px;font-weight:700;padding:14px 48px;border:none;border-radius:50px;cursor:pointer;box-shadow:0 6px 0 #0a2240,0 8px 18px rgba(0,0,0,0.25);transition:all 0.1s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0a2240}
#gameover-screen{background:linear-gradient(170deg,#ffecd2,#fcb69f);display:none}
#gameover-screen h2{font-family:'Baloo 2',cursive;font-size:44px;font-weight:800;color:#1D3557;margin-bottom:8px}
#final-msg{font-family:'Nunito',sans-serif;font-size:22px;color:#1D3557;margin-bottom:28px;font-weight:700}
#danger-overlay{position:absolute;inset:0;pointer-events:none;background:rgba(239,35,60,0.38);opacity:0;z-index:11;transition:opacity 0.15s}
.popup{position:absolute;font-size:22px;font-family:'Nunito',sans-serif;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.5);pointer-events:none;z-index:15;transform:translateX(-50%);animation:popUp 0.9s ease forwards}
@keyframes popUp{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-65px) scale(1.3)}}
#hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.92);border-radius:14px;padding:8px 18px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:#1D3557;z-index:12;pointer-events:none;display:none;animation:hintA 4s ease forwards;animation-delay:0.5s;opacity:0}
@keyframes hintA{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
#loading{position:absolute;inset:0;background:linear-gradient(170deg,#fde8f0,#e8f4fd);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}
#loading p{font-family:'Baloo 2',cursive;font-size:22px;color:#1D3557;margin-top:16px}
.spinner{width:48px;height:48px;border:5px solid #e0d0f0;border-top-color:#1D3557;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="gc"></canvas>
<div id="hud">
  <div id="score-box">⭐ <span id="sc">0</span></div>
  <div id="lives"><span class="heart" id="h1">❤️</span><span class="heart" id="h2">❤️</span><span class="heart" id="h3">❤️</span></div>
</div>
<div id="danger-overlay"></div>
<div id="loading"><div class="spinner"></div><p>Loading...</p></div>
<div class="screen" id="start-screen" style="display:none">
  <h1>Aviv & Luka's<br>City Adventure</h1>
  <p>Swipe to explore the city!<br>Collect snacks — stay off the road! 🚗</p>
  <button class="btn" id="start-btn">🌟 Let's Go!</button>
</div>
<div class="screen" id="gameover-screen">
  <h2>Oops! 🚗</h2>
  <div id="final-msg">You collected <span id="fsn">0</span> snacks!</div>
  <button class="btn" id="restart-btn">🔄 Try Again</button>
</div>
<div id="hint">👆 Swipe to move Aviv & Luka!</div>
</div>
<script>
const wrap=document.getElementById('wrap');
const gc=document.getElementById('gc');
const ctx=gc.getContext('2d');
let W,H;
function resize(){W=gc.width=wrap.clientWidth;H=gc.height=wrap.clientHeight;}
resize();
const IMG={};
function loadImg(key,src){return new Promise(res=>{const i=new Image();i.onload=()=>{IMG[key]=i;res(true);};i.onerror=()=>{console.warn('Failed:',key);res(false);};i.src=src;});}

// World size matches background image
const WORLD_W=1344;
const WORLD_H=896;
const MARGIN=120;

// Road zones based on red markings:
// Two diagonal roads crossing — approximated as rotated polygons
// Using point-in-polygon test for diagonal roads
const ROAD_POLYS = [
  // Road 1: top-right to center-left (diagonal ↘ to ↙)
  [{x:300,y:150},{x:500,y:150},{x:280,y:420},{x:80,y:420}],
  // Road 1 continued: center to bottom-right
  [{x:280,y:380},{x:480,y:380},{x:780,y:780},{x:580,y:780}],
  // Road 2: left side going down-right
  [{x:0,y:280},{x:180,y:280},{x:480,y:560},{x:300,y:560}],
  // Road 2 continued: bottom crossing
  [{x:300,y:520},{x:500,y:520},{x:900,y:820},{x:700,y:820}],
];

function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

function isOnRoad(wx,wy){
  return ROAD_POLYS.some(poly=>pointInPoly(wx,wy,poly));
}

// Safe snack positions (green areas)
const SNACK_POSITIONS=[
  {x:180,y:100},{x:400,y:80},{x:700,y:100},{x:1000,y:80},{x:1200,y:150},
  {x:100,y:500},{x:600,y:300},{x:900,y:280},{x:1100,y:350},
  {x:700,y:550},{x:900,y:500},{x:1100,y:600},{x:1200,y:700},
  {x:200,y:750},{x:400,y:800},{x:600,y:820},{x:1000,y:820},
];

let snacks=[];
function genSnacks(){
  snacks=SNACK_POSITIONS.map((p,i)=>({
    wx:p.x,wy:p.y,kind:i%2===0?'cookie':'bone',
    collected:false,bob:Math.random()*Math.PI*2,
    rot:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.04
  }));
}

const player={wx:670,wy:200,vx:0,vy:0,invincible:0,dir:'forward',speed:4};
let state='loading',score=0,lives=3,frame=0,raf;

function drawPlayer(){
  const px=W/2,py=H/2,bob=Math.sin(frame*0.1)*3;
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.ellipse(px,py+10+bob,45,12,0,0,Math.PI*2);ctx.fill();
  const avivImg=IMG['aviv_'+player.dir]||IMG.aviv_forward;
  const lukaImg=IMG['luka_'+player.dir]||IMG.luka_forward;
  const avivH=110,lukaH=80;
  if(lukaImg){
    const lw=lukaImg.width/lukaImg.height*lukaH;
    ctx.save();
    if(player.dir==='side-left'){ctx.translate(px+30+lw/2,py+20+bob);ctx.scale(-1,1);ctx.drawImage(lukaImg,-lw/2,-lukaH,lw,lukaH);}
    else{ctx.drawImage(lukaImg,px+30-lw/2,py+20-lukaH+bob,lw,lukaH);}
    ctx.restore();
  }
  if(avivImg){
    const aw=avivImg.width/avivImg.height*avivH;
    ctx.save();
    if(player.dir==='side-left'){ctx.translate(px-10+aw/2,py+bob);ctx.scale(-1,1);ctx.drawImage(avivImg,-aw/2,-avivH,aw,avivH);}
    else{ctx.drawImage(avivImg,px-10-aw/2,py-avivH+bob,aw,avivH);}
    ctx.restore();
  }
}

function drawSnacks(){
  const camX=player.wx-W/2,camY=player.wy-H/2;
  snacks.forEach(s=>{
    if(s.collected)return;
    const sx=s.wx-camX,sy=s.wy-camY;
    if(sx<-60||sx>W+60||sy<-60||sy>H+60)return;
    const bob=Math.sin(frame*0.05+s.bob)*6;
    s.rot+=s.rotSpeed;
    ctx.save();ctx.translate(sx,sy+bob);ctx.rotate(s.rot);
    ctx.shadowBlur=18;ctx.shadowColor='rgba(255,220,0,0.9)';
    const img=s.kind==='cookie'?IMG.cookie:IMG.bone;
    if(img){ctx.drawImage(img,-22,-22,44,44);}
    else{ctx.font='28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.kind==='cookie'?'🍪':'🦴',0,0);}
    ctx.shadowBlur=0;ctx.restore();
  });
}

function render(){
  ctx.clearRect(0,0,W,H);
  const camX=player.wx-W/2,camY=player.wy-H/2;
  if(IMG.bg){ctx.drawImage(IMG.bg,-camX,-camY,WORLD_W,WORLD_H);}
  else{ctx.fillStyle='#2d5a27';ctx.fillRect(0,0,W,H);}
  drawSnacks();drawPlayer();
}

function update(){
  frame++;
  player.wx+=player.vx;player.wy+=player.vy;
  player.vx*=0.84;player.vy*=0.84;
  player.wx=Math.max(MARGIN,Math.min(WORLD_W-MARGIN,player.wx));
  player.wy=Math.max(MARGIN,Math.min(WORLD_H-MARGIN,player.wy));
  if(player.invincible<=0&&isOnRoad(player.wx,player.wy)){
    lives--;player.invincible=100;updateLives();flashDanger();
    if(lives<=0){setTimeout(endGame,500);return;}
  }
  if(player.invincible>0)player.invincible--;
  const camX=player.wx-W/2,camY=player.wy-H/2;
  snacks.forEach(s=>{
    if(s.collected)return;
    if(Math.abs(s.wx-player.wx)<50&&Math.abs(s.wy-player.wy)<50){
      s.collected=true;score++;
      document.getElementById('sc').textContent=score;
      popup(s.kind==='cookie'?'+1 🍪':'+1 🦴',s.wx-camX,s.wy-camY-30);
    }
  });
  if(snacks.every(s=>s.collected))snacks.forEach(s=>s.collected=false);
}

function flashDanger(){const o=document.getElementById('danger-overlay');o.style.opacity='1';setTimeout(()=>o.style.opacity='0',350);}
function popup(txt,x,y){const d=document.createElement('div');d.className='popup';d.style.left=x+'px';d.style.top=y+'px';d.textContent=txt;wrap.appendChild(d);setTimeout(()=>d.remove(),900);}

let touchStart=null;
wrap.addEventListener('touchstart',e=>{if(state!=='playing')return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
wrap.addEventListener('touchmove',e=>{
  if(state!=='playing'||!touchStart)return;e.preventDefault();
  const dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1,spd=Math.min(len*0.07,player.speed);
  player.vx=(dx-dy)*0.5/len*spd*1.4;player.vy=(dx+dy)*0.5/len*spd;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(adx>ady)player.dir=dx>0?'side':'side-left';else player.dir=dy>0?'forward':'backward';
},{passive:false});
wrap.addEventListener('touchend',()=>{touchStart=null;},{passive:true});
let mdown=false,mstart=null;
wrap.addEventListener('mousedown',e=>{if(state!=='playing')return;mdown=true;mstart={x:e.clientX,y:e.clientY};});
wrap.addEventListener('mousemove',e=>{
  if(!mdown||!mstart||state!=='playing')return;
  const dx=e.clientX-mstart.x,dy=e.clientY-mstart.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1,spd=Math.min(len*0.07,player.speed);
  player.vx=(dx-dy)*0.5/len*spd*1.4;player.vy=(dx+dy)*0.5/len*spd;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(adx>ady)player.dir=dx>0?'side':'side-left';else player.dir=dy>0?'forward':'backward';
});
wrap.addEventListener('mouseup',()=>{mdown=false;});

function loop(){update();render();raf=requestAnimationFrame(loop);}
function startGame(){
  score=0;lives=3;frame=0;player.wx=670;player.wy=200;
  player.vx=0;player.vy=0;player.invincible=0;player.dir='forward';
  document.getElementById('sc').textContent='0';
  updateLives();genSnacks();
  document.getElementById('start-screen').style.display='none';
  document.getElementById('gameover-screen').style.display='none';
  document.getElementById('hud').style.display='flex';
  const hint=document.getElementById('hint');
  hint.style.display='block';hint.style.animation='none';hint.offsetHeight;
  hint.style.animation='hintA 4s ease forwards';hint.style.animationDelay='0.3s';
  state='playing';loop();
}
function endGame(){state='gameover';cancelAnimationFrame(raf);document.getElementById('hud').style.display='none';document.getElementById('fsn').textContent=score;document.getElementById('gameover-screen').style.display='flex';}
function updateLives(){['h1','h2','h3'].forEach((id,i)=>document.getElementById(id).classList.toggle('lost',i>=lives));}
document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('restart-btn').addEventListener('click',startGame);

async function init(){
  await Promise.all([
    loadImg('bg','ChatGPT_Image_Jul_16__2026__09_54_09_AM.png'),
    loadImg('aviv_forward','aviv_forward.png'),
    loadImg('aviv_backward','aviv_backward.png'),
    loadImg('aviv_side','aviv_side.png'),
    loadImg('luka_forward','luka_forward.png'),
    loadImg('luka_backward','luka_backward.png'),
    loadImg('luka_side','luka_side.png'),
    loadImg('cookie','COOKIE.png'),
    loadImg('bone','BONE.png'),
  ]);
  document.getElementById('loading').style.display='none';
  document.getElementById('start-screen').style.display='flex';
  state='start';
}
init();
</script>
</body>
</html>
